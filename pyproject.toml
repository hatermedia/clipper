[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipper-gg"
version = "0.2.1"
description = "Automatic gaming highlight trimmer: audio + motion detection, lossless FFmpeg cuts, local web UI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "hatermedia" }]
keywords = [
  "gaming",
  "highlights",
  "clipper",
  "ffmpeg",
  "video-editing",
  "twitch",
  "youtube",
  "opencv",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
  "Topic :: Multimedia :: Video :: Non-Linear Editor",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "opencv-python-headless>=4.9",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.7"]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "build>=1.2",
  "twine>=5.0",
]

[project.scripts]
clipper = "clipper.cli:main"
clipper-desktop = "clipper.desktop:main"

[project.urls]
Homepage = "https://github.com/hatermedia/clipper"
Repository = "https://github.com/hatermedia/clipper"
Issues = "https://github.com/hatermedia/clipper/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"clipper" = ["assets/*"]
"clipper.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
