<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  html, body { margin: 0; width: 512px; height: 512px; overflow: hidden; background: transparent; }
  .icon {
    width: 512px; height: 512px; border-radius: 116px;
    background:
      radial-gradient(70% 70% at 30% 15%, rgba(34,211,238,.42), transparent 65%),
      linear-gradient(145deg, #0f1b2a, #06090f 70%);
    position: relative; display: grid; place-items: center;
    box-shadow: inset 0 0 0 14px rgba(34,211,238,.18);
  }
  .ring { position: absolute; inset: 34px; border: 8px solid rgba(34,211,238,.25); border-radius: 88px; }
  svg { width: 246px; height: 246px; color: #67e8f9; filter: drop-shadow(0 0 28px rgba(34,211,238,.45)); }
  .dot { position: absolute; width: 34px; height: 34px; border-radius: 50%; background: #f43f5e; right: 112px; bottom: 112px; box-shadow: 0 0 26px rgba(244,63,94,.7); }
</style>
</head>
<body>
  <div class="icon">
    <div class="ring"></div>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="6" cy="6" r="3"></circle>
      <circle cx="6" cy="18" r="3"></circle>
      <path d="M20 4L8.12 15.88M14.47 14.48L20 20M8.12 8.12L12 12"></path>
    </svg>
    <div class="dot"></div>
  </div>
</body>
</html>
